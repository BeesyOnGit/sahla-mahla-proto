# Host nginx in front of the container: one domain per server, matching the ports in .env.
# Install on the VPS:
#   sudo cp nginx.conf /etc/nginx/sites-available/sahla-mahla
#   sudo ln -s /etc/nginx/sites-available/sahla-mahla /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sahla.inovsoft.online -d api.sahla.inovsoft.online -d cdn.sahla.inovsoft.online
# certbot adds the HTTPS blocks and the HTTP → HTTPS redirect itself.

# Front end (APP_PORT)
server {
    listen 80;
    server_name sahla.inovsoft.online;

    location / {
        proxy_pass http://127.0.0.1:5111;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API (API_PORT)
server {
    listen 80;
    server_name api.sahla.inovsoft.online;

    # Same upload limit as the API's body parser
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets (socket.io)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# CDN (CDN_PORT)
server {
    listen 80;
    server_name cdn.sahla.inovsoft.online;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:4111;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
